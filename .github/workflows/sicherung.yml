# Datensicherung alle zwei Monate: alle Routen, Haken und Modellversionen als Datei in backup/.
# Die Datei ist mit dem Gruppen-Code verschlüsselt, weil das Repository öffentlich ist.
# Voraussetzung: Secret GROUP_CODE (Settings > Secrets and variables > Actions).
name: Datensicherung

on:
  schedule:
    - cron: '0 4 1 */2 *'    # am Ersten jedes zweiten Monats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Daten holen und verschlüsseln
        env:
          GROUP_CODE: ${{ secrets.GROUP_CODE }}
        run: |
          if [ -z "$GROUP_CODE" ]; then echo "Secret GROUP_CODE fehlt"; exit 1; fi
          base='https://dryfdwazdeaprmrvzgiv.supabase.co/rest/v1'
          get() { curl -sSf "$base/$1" -H 'apikey: sb_publishable_rFhTv60WchPuuMjHc9rnRQ_1B4J2eKf' -H "x-group-code: $GROUP_CODE"; }
          routes=$(get 'routes?select=*'); sends=$(get 'sends?select=*'); models=$(get 'models?select=*')
          n=$(echo "$routes" | jq length)
          if [ "$n" = 0 ]; then echo "Keine Routen gelesen (Code falsch?)"; exit 1; fi
          jq -n --argjson r "$routes" --argjson s "$sends" --argjson m "$models" \
            '{erstellt: (now | todate), routes: $r, sends: $s, models: $m}' > /tmp/sicherung.json
          f="backup/sicherung-$(date -u +%F).json.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/sicherung.json -out "$f" -pass env:GROUP_CODE
          echo "$n Routen gesichert in $f"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup
          git commit -m "Datensicherung: $n Routen" && git push
