# Datensicherung alle zwei Monate: alle Routen, Haken, Kommentare und Modellversionen als Datei in backup/.
# Die Datei ist mit dem Gruppen-Code verschlüsselt, weil das Repository öffentlich ist.
# Voraussetzung: Secret GROUP_CODE (Settings > Secrets and variables > Actions).
name: Datensicherung

on:
  schedule:
    - cron: '0 4 1 */2 *'    # am Ersten jedes zweiten Monats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Daten holen und verschlüsseln
        env:
          GROUP_CODE: ${{ secrets.GROUP_CODE }}
        run: |
          if [ -z "$GROUP_CODE" ]; then echo "Secret GROUP_CODE fehlt"; exit 1; fi
          base='https://dryfdwazdeaprmrvzgiv.supabase.co/rest/v1'
          key='sb_publishable_rFhTv60WchPuuMjHc9rnRQ_1B4J2eKf'
          # Erst prüfen, ob Supabase erreichbar ist (bis zu 6 Versuche), damit
          # ein pausiertes Projekt eine verständliche Fehlermeldung ergibt.
          if ! curl -sSf -o /dev/null --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 \
               "$base/models?select=*&limit=1" -H "apikey: $key"; then
            echo "::error::Supabase nicht erreichbar. Ist das Projekt pausiert? Im Supabase-Dashboard 'Resume project' klicken und die Sicherung unter Actions von Hand neu starten."
            exit 1
          fi
          get() { curl -sSf --retry 3 --retry-delay 10 "$base/$1" -H "apikey: $key" -H "x-group-code: $GROUP_CODE"; }
          routes=$(get 'routes?select=*'); sends=$(get 'sends?select=*'); models=$(get 'models?select=*')
          comments=$(get 'comments?select=*' || echo '[]')
          n=$(echo "$routes" | jq length)
          if [ "$n" = 0 ]; then echo "Keine Routen gelesen (Code falsch?)"; exit 1; fi
          jq -n --argjson r "$routes" --argjson s "$sends" --argjson m "$models" --argjson c "$comments" \
            '{erstellt: (now | todate), routes: $r, sends: $s, models: $m, comments: $c}' > /tmp/sicherung.json
          f="backup/sicherung-$(date -u +%F).json.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/sicherung.json -out "$f" -pass env:GROUP_CODE
          echo "$n Routen gesichert in $f"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backup
          git commit -m "Datensicherung: $n Routen" && git push
